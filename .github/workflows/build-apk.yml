name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev libltdl-dev
          pip install --user --break-system-packages --upgrade buildozer cython
          # host-side deps needed when pymunk's setup.py (cffi) builds on the host python
          pip install --break-system-packages pycparser cffi

      - name: Cache buildozer deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', '.github/workflows/build-apk.yml') }}-v4

      - name: Build debug APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export LC_ALL=C
          # First pass builds python3 + hostpython up to pymunk, providing the hostpython binary
          buildozer android debug || true
          # install pycparser into the hostpython that pymunk's setup.py uses
          for CAND in $(find .buildozer -type f \( -name 'python3' -o -name 'python3.9' -o -name 'python' \) -path '*hostpython3*' 2>/dev/null); do
            echo "hostpython candidate: $CAND"
            "$CAND" -m pip install pycparser setuptools 2>&1 | tail -1 || true
          done
          buildozer android debug
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mountain-rider-apk
          path: bin/*.apk
