name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev libltdl-dev
          pip install --user --break-system-packages --upgrade buildozer cython

      - name: Build debug APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export LC_ALL=C
          # First pass: fetch/build python3+numpy, will stop at pygame missing header
          buildozer android debug || true
          # Supply longintrepr.h that p4a does not install, pygame needs it
          SRC=$(find .buildozer -path '*/Include/longintrepr.h' | head -n 1)
          echo "longintrepr source: $SRC"
          if [ -n "$SRC" ]; then
            for D in $(find .buildozer -type d -name 'python3.11'); do
              cp "$SRC" "$D/longintrepr.h" && echo "copied to $D"
            done
          fi
          buildozer android debug
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mountain-rider-apk
          path: bin/*.apk
